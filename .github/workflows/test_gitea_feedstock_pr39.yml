name: Test Gitea macOS build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - config: osx_arm64_
            runner: macos-15

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: rattler
          channels: conda-forge
          channel-priority: strict

      - name: Create standalone build inputs
        shell: bash
        run: |
           cat > recipe.yaml <<'RECIPE'
           schema_version: 1

           context:
             name: gitea
             version: "28.3.0"
             
           package:
             name: {{ name|lower }}
             version: {{ version }}

           source:
             url: https://github.com/go-gitea/__RATTLER_EXPR_OPEN__ name }}/archive/v__RATTLER_EXPR_OPEN__ version }}.tar.gz
             sha256: c2060e8ccf89c07764f834d2e96a3fdbd3d2f203cd49b99415ab1fd827192e56

           build:
             number: 0
             skip: win

           requirements:
             build:
               - {{ compiler('cgo') }} 1.27.*
               - {{ compiler('c') }}
               - {{ stdlib("c") }}
               - if: not win
                 then: file
               - go-licenses
               - make
               - nodejs >=20
               - pnpm
             run:
               - git

           tests:
             - script:
                 - gitea --version
                 - gitea --help

           about:
             license: MIT
             license_file:
               - LICENSE
               - license-files/
             summary: Git with a cup of tea
             description: |
               The goal of this project is to make the easiest, fastest, and most
               painless way of setting up a self-hosted Git service.
             homepage: https://about.gitea.com
             repository: https://github.com/go-gitea/gitea
             documentation: https://docs.gitea.com
            RECIPE

            cat > conda_build_config.yaml <<'CONFIG'
            c_stdlib_version:         # [osx]
              - "13.0"                # [osx]
            CONFIG

            cat > build.sh <<'BUILD'
            #!/bin/sh
            set -eux
            
            env | sort
            go env CC CGO_CFLAGS CGO_ENABLED GOARCH GOOS GOFLAGS
            
            unset LDFLAGS
            echo "$PKG_VERSION" > VERSION

            export TAGS="bindata timetzdata"
            make frontend
            rm -rf Library/pnpm
            make generate-backend
            make gitea

            mkdir -p "$PREFIX/bin"
            cp gitea "$PREFIX/bin/gitea"
            
            go-licenses save . --save_path=./license-files || true
            test -d license-files/github.com
            BUILD

            cat > osx_64_.yaml <<'CONFIG'
            MACOSX_SDK_VERSION:
              - '11.0'
            c_compiler:
              - clang
            c_compiler_version:
              - '21'
            c_stdlib:
              - macosx_deployment_target
            c_stdlib_version:
              - '11.0'
            cgo_compiler:
              - go-cgo
            channel_sources:
              - conda-forge
            channel_targets:
              - conda-forge main
            macos_machine:
              - x86_64-apple-darwin13.4.0
            target_platform:
              - osx-64
            CONFIG

           cat > osx_arm64_.yaml <<'CONFIG'
           MACOSX_SDK_VERSION:
             - '11.0'
           c_compiler:
             - clang
           c_compiler_version:
             - '21'
           c_stdlib:
             - macosx_deployment_target
           c_stdlib_version:
             - '11.0'
           cgo_compiler:
             - go-cgo
           channel_sources:
             - conda-forge
           channel_targets:
             - conda-forge main
           macos_machine:
             - arm64-apple-darwin20.0.0
           target_platform:
             - osx-arm64
           CONFIG
             
      - name: Build recipe
        shell: bash -el {0}
        run: |
          conda install -y rattler-build
          rattler-build build -r . -m "${{ matrix.config }}.yaml"
