name: Test Gitea macOS build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          #- config: osx_64_
          #  runner: macos-15-intel
          - config: osx_arm64_
            runner: macos-15
            
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: rattler
          conda-solver: libmamba
          channels: conda-forge
          channel-priority: strict
          python-version: 3.14
      - name: Install rattler-build
        shell: bash -el {0}
        run: |
          conda install -y rattler-build conda-forge-ci-setup=4

      - name: Create standalone build inputs
        shell: bash
        run: |
          cat > recipe.yaml <<'RECIPE'
          schema_version: 1

          context:
            name: gitea
            version: "28.3.0"

          package:
            name: __RATTLER_EXPR_OPEN__ name|lower }}
            version: __RATTLER_EXPR_OPEN__ version }}

          source:
            url: https://github.com/go-gitea/__RATTLER_EXPR_OPEN__ name }}/archive/v__RATTLER_EXPR_OPEN__ version }}.tar.gz
            sha256: c2060e8ccf89c07764f834d2e96a3fdbd3d2f203cd49b99415ab1fd827192e56

          build:
            number: 0
            skip: win

          requirements:
            build:
              - __RATTLER_EXPR_OPEN__ compiler('cgo') }} 1.27.*
              - __RATTLER_EXPR_OPEN__ compiler('c') }}
              - __RATTLER_EXPR_OPEN__ stdlib("c") }}
              - if: not win
                then: file
              - go-licenses
              - make
              - nodejs >=20
              - pnpm
            run:
              - git

          tests:
            - script:
                - gitea --version
                - gitea --help

          about:
            license: MIT
            license_file:
              - LICENSE
            summary: Git with a cup of tea
            description: |
              The goal of this project is to make the easiest, fastest, and most
              painless way of setting up a self-hosted Git service.
            homepage: https://about.gitea.com
            repository: https://github.com/go-gitea/gitea
            documentation: https://docs.gitea.com
          RECIPE

          cat > conda_build_config.yaml <<'CONFIG'
          MACOSX_DEPLOYMENT_TARGET: # [osx]
            - "13.0"                # [osx]
          CONFIG

          cat > build.sh <<'BUILD'
          #!/bin/sh
          set -eux

          env | sort
          go env CC CGO_CFLAGS CGO_ENABLED GOARCH GOOS GOFLAGS

          unset LDFLAGS
          echo "$PKG_VERSION" > VERSION

          export TAGS="bindata timetzdata"
          make frontend
          rm -rf Library/pnpm
          make generate-backend
          make gitea

          mkdir -p "$PREFIX/bin"
          cp gitea "$PREFIX/bin/gitea"
          BUILD

          cat > osx_64_.yaml <<'CONFIG'
          MACOSX_SDK_VERSION:
            - '11.0'
          c_compiler:
            - clang
          c_compiler_version:
            - '21'
          c_stdlib:
            - macosx_deployment_target
          c_stdlib_version:
            - '11.0'
          cgo_compiler:
            - go-cgo
          channel_sources:
            - conda-forge
          channel_targets:
            - conda-forge main
          macos_machine:
            - x86_64-apple-darwin13.4.0
          target_platform:
            - osx-64
          CONFIG

          cat > osx_arm64_.yaml <<'CONFIG'
          MACOSX_SDK_VERSION:
            - '11.0'
          c_compiler:
            - clang
          c_compiler_version:
            - '21'
          c_stdlib:
            - macosx_deployment_target
          c_stdlib_version:
            - '11.0'
          cgo_compiler:
            - go-cgo
          channel_sources:
            - conda-forge
          channel_targets:
            - conda-forge main
          macos_machine:
            - arm64-apple-darwin20.0.0
          target_platform:
            - osx-arm64
          CONFIG

          python -c 'from pathlib import Path; p=Path("recipe.yaml"); p.write_text(p.read_text().replace("__RATTLER_EXPR_OPEN__", chr(36) + chr(123)*2))'

      - name: Build recipe # Ref: .script/run_osx_build.sh
        shell: bash -el {0}
        run: |
          export CI=github_actions
          export FEEDSTOCK_NAME=gitea-feedstock
          export GIT_BRANCH=test
          export MINIFORGE_HOME=~/miniforge3
          export CONDA_BLD_PATH=${MINIFORGE_HOME}/conda-bld
          export OSX_FORCE_SDK_DOWNLOAD="1"
          export FEEDSTOCK_ROOT=${PWD}
          export RECIPE_ROOT=$(pwd)
          export CONFIG_FILE="${{ matrix.config }}.yaml"
          arch=$(uname -m)
          if [[ "${arch}" == "x86_64" ]]; then
            arch="64"
          fi
          export CONDA_SOLVER="libmamba"
          export CONDA_LIBMAMBA_SOLVER_NO_CHANNELS_FROM_INSTALLED=1

          echo Setting up configuration
          setup_conda_rc "${FEEDSTOCK_ROOT}" "${RECIPE_ROOT}" "${CONFIG_FILE}"
          
          # macOS-specific setup
          if [[ "${CI:-}" != "" ]]; then
              mangle_compiler "${FEEDSTOCK_ROOT}" "${RECIPE_ROOT}" "${CONFIG_FILE}"
          fi
          
          if [[ "${CI:-}" != "" ]]; then
              echo "Mangling homebrew in the CI to avoid conflicts."
              /usr/bin/sudo mangle_homebrew
              /usr/bin/sudo -k
          else
              echo "Not mangling homebrew as we are not running in CI"
          fi

          if [[ "${OSX_SDK_DIR:-}" == "" ]]; then
              if [[ "${CI:-}" == "" ]]; then
                  echo "Please set OSX_SDK_DIR to a directory where SDKs can be downloaded to. Aborting"
                  exit 1
              else
                  export OSX_SDK_DIR=/opt/conda-sdks
                  /usr/bin/sudo mkdir -p "${OSX_SDK_DIR}"
                  /usr/bin/sudo chown "${USER}" "${OSX_SDK_DIR}"
              fi
          else
              if tmpf=$(mktemp "$OSX_SDK_DIR"/tmp.XXXXXXXX 2>/dev/null); then
                  rm -f "$tmpf"
                  echo "OSX_SDK_DIR is writeable without sudo, continuing"
              else
                  echo "User-provided OSX_SDK_DIR is not writeable for current user! Aborting"
                  exit 1
              fi
          fi

          echo Running build setup
          source run_conda_forge_build_setup
          
          echo Building recipe
          
          rattler-build build \
              --recipe "${RECIPE_ROOT}" \
              -m "${CONFIG_FILE}" \
              --build-platform "${BUILD_PLATFORM}" \
              --target-platform "${HOST_PLATFORM}" \
